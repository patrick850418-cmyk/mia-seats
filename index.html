<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>2026 MIA春季成發 即時座位系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .main-content { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .sidebar { width: 320px; background: white; border-left: 2px solid #ddd; padding: 20px; display: none; flex-direction: column; overflow-y: auto; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        .admin-active .sidebar { display: flex; }

        .title-container { text-align: center; margin-bottom: 10px; line-height: 1.2; }
        .title-top { font-size: 20px; color: #2c3e50; font-weight: bold; }
        .title-bottom { font-size: 18px; color: #2c3e50; font-weight: bold; }
        @media (max-width: 768px) {
            .title-top { font-size: 18px; }
            .title-bottom { font-size: 16px; }
        }

        .venue-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 20px 0; display: block; }
        .stage-area { width: fit-content; min-width: 1150px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding: 0 40px; }
        
        .legend-area { display: flex; gap: 10px; margin-bottom: 15px; font-size: 12px; background: #fff; padding: 8px 15px; border-radius: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-wrap: wrap; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; }
        .screen { background: #333; width: 450px; margin-bottom: 30px; padding: 10px; color: #fff; border-radius: 0 0 50px 50px; font-weight: bold; letter-spacing: 10px; text-align: center; }
        
        .venue-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; }
        .block { display: flex; flex-direction: column; gap: 5px; }
        .row { display: flex; gap: 3px; height: 32px; align-items: center; }
        .left-side .row { justify-content: flex-end; }
        .middle-side .row { justify-content: center; }
        .right-side .row { justify-content: flex-start; }

        .seat { width: 32px; height: 32px; font-size: 10px; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; font-weight: bold; background: #fff; box-sizing: border-box; }
        .admin-active .seat { cursor: pointer; }
        .available { background-color: #fff; color: #333; }
        .sold { background-color: #ff6b6b !important; color: #fff !important; border-color: #ee5253; }
        
        /* 選取狀態：改為鮮豔橘色，確保公關席也明顯 */
        .selected { border: 3px solid #ff9800 !important; background-color: #fff3e0 !important; z-index: 10; }
        
        /* 攝影席：移除 X 符號 */
        .camera-seat { background: #9e9e9e !important; color: #fff !important; border: 1px solid #757575 !important; }
        
        .pr-seat { border: 2px solid #007bff !important; color: #007bff; background-color: #f0f7ff; }

        .info-card { background-color: #ebedef; border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; position: relative; overflow: hidden; }
        .info-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
        .card-blue::before { background-color: #007bff; }
        .card-red::before { background-color: #dc3545; }
        .card-value { font-size: 24px; font-weight: bold; color: #007bff; }
        .card-detail-item { font-size: 15px; margin-bottom: 6px; line-height: 1.4; color: #333; border-bottom: 1px solid #dee2e6; padding-bottom: 4px; }
        .card-detail-item b { color: #555; display: inline-block; width: 85px; }

        .scroll-hint { color: #d32f2f; font-size: 14px; font-weight: bold; margin-bottom: 10px; display: none; background: #ffebee; padding: 5px 15px; border-radius: 15px; }
        @media (max-width: 768px) { .scroll-hint { display: block; } }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-sell { background: #28a745; color: white; }
        .btn-refund { background: #dc3545; color: white; }
        .btn-export { background: #6c757d; color: white; font-size: 13px; margin-top: 20px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .admin-entry-btn { margin: 30px 0; padding: 10px 20px; background: #eee; border: 1px solid #ccc; border-radius: 5px; color: #777; font-size: 12px; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="title-container">
            <div class="title-top">2026 8th MIA SPRING SHOW</div>
            <div class="title-bottom">即時座位</div>
        </div>

        <div class="legend-area">
            <div class="legend-item"><div class="legend-box" style="background:#fff;"></div><span>可選</span></div>
            <div class="legend-item"><div class="legend-box" style="background:#ff6b6b;"></div><span>已售</span></div>
            <div class="legend-item"><div class="legend-box pr-seat"></div><span>公關席</span></div>
            <div class="legend-item"><div class="legend-box camera-seat"></div><span>攝影席</span></div>
        </div>
        
        <div class="scroll-hint">←左右滑動查看完整座位→</div>

        <div class="venue-wrapper">
            <div class="stage-area">
                <div class="screen">舞台方向</div>
                <div class="venue-container" id="grid">
                    <div id="LT" class="block left-side"></div><div id="MT" class="block middle-side"></div><div id="RT" class="block right-side"></div>
                    <div id="LM" class="block left-side"></div><div id="MM" class="block middle-side"></div><div id="RM" class="block right-side"></div>
                    <div id="LB" class="block left-side"></div><div id="MB" class="block middle-side"></div><div id="RB" class="block right-side"></div>
                </div>
            </div>
        </div>
        <button class="admin-entry-btn" id="admin-login-btn">🔒 管理員模式</button>
    </div>

    <div class="sidebar">
        <h2>票務管理中心</h2>
        <div class="info-card card-blue"><div id="target-id" class="card-value">請點選座位...</div></div>
        <div id="sell-zone">
            <label>購票人姓名</label><input type="text" id="p-name">
            <label>購票人電話</label><input type="text" id="p-phone">
            <label>付款日期</label><input type="date" id="p-date">
            <label>售票人員</label>
            <select id="p-staff">
                <option value="">請選擇人員</option><option value="芷瑜">芷瑜</option><option value="Daifi">Daifi</option><option value="Ruby">Ruby</option><option value="孟萱">孟萱</option>
            </select>
            <label>備註</label><input type="text" id="p-note">
            <button class="btn btn-sell" id="btn-sell-action">確認劃位售出</button>
        </div>
        <div id="info-zone" style="display:none;">
            <div class="info-card card-red"><div id="sold-detail"></div></div>
            <button class="btn btn-refund" id="btn-refund-action">取消售出 (退票)</button>
        </div>
        <button class="btn btn-export" id="btn-export-action">📥 匯出 CSV 名冊</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8gIluzZA5k8fkIpC0RKvUypsSRZM9rlM",
            authDomain: "seatsystem-dbfc5.firebaseapp.com",
            databaseURL: "https://seatsystem-dbfc5-default-rtdb.firebaseio.com",
            projectId: "seatsystem-dbfc5",
            storageBucket: "seatsystem-dbfc5.firebasestorage.app",
            messagingSenderId: "924114074974",
            appId: "1:924114074974:web:3ad35d39cc6813c636a3cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
        if(isAdmin) document.body.classList.add('admin-active');

        document.getElementById('admin-login-btn').onclick = () => {
            const pw = prompt("請輸入管理員密碼：");
            if(pw === "mia2026") {
                isAdmin = true;
                document.body.classList.add('admin-active');
            } else if(pw !== null) alert("密碼錯誤");
        };

        let seatsData = {};
        let selectedIds = [];
        const cameraSeats = ["F15", "F16", "F17", "G15", "G16", "G17"];
        const prSeats = [];
        for(let i=8; i<=20; i++) prSeats.push("A"+i);
        for(let i=9; i<=21; i++) prSeats.push("B"+i);

        const layout = [
            { id: 'T', rows: 5, L: [7,8,9,10,11], M: 13, R: [7,8,9,10,11], start: 'A' },
            { id: 'M', rows: 10, L: 9, M: 13, R: 9, start: 'F' },
            { id: 'B', rows: 10, L: 6, M: 13, R: 6, start: 'P' }
        ];

        onValue(ref(db, 'seats'), (snapshot) => {
            seatsData = snapshot.val() || {};
            render();
        });

        function render() {
            layout.forEach(sec => {
                for(let r=0; r<sec.rows; r++){
                    const rowName = String.fromCharCode(sec.start.charCodeAt(0)+r);
                    const cL = Array.isArray(sec.L)?sec.L[r]:sec.L;
                    const cM = sec.M;
                    const cR = Array.isArray(sec.R)?sec.R[r]:sec.R;
                    updateBlock(`L${sec.id}`, rowName, 1, cL);
                    updateBlock(`M${sec.id}`, rowName, cL+1, cL+cM);
                    updateBlock(`R${sec.id}`, rowName, cL+cM+1, cL+cM+cR);
                }
            });
            if(!document.getElementById('p-date').value) document.getElementById('p-date').valueAsDate = new Date();
        }

        function updateBlock(bid, rowName, start, end) {
            const block = document.getElementById(bid);
            if(rowName==='A' || rowName==='F' || rowName==='P') block.innerHTML = '';
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for(let s=start; s<=end; s++){
                const id = rowName + s;
                const div = document.createElement('div');
                if (cameraSeats.includes(id)) {
                    div.className = "seat camera-seat";
                } else {
                    const status = (seatsData[id] && seatsData[id].status) ? seatsData[id].status : 'available';
                    const isPR = prSeats.includes(id);
                    div.className = `seat ${status} ${isPR ? 'pr-seat' : ''}`;
                    if(selectedIds.includes(id)) div.classList.add('selected');
                    div.innerText = id;
                    div.onclick = () => { if(isAdmin) handleClick(id); };
                }
                rowDiv.appendChild(div);
            }
            block.appendChild(rowDiv);
        }

        function handleClick(id) {
            const currentSeat = seatsData[id] || { status: 'available' };
            if (currentSeat.status === 'sold') {
                selectedIds = [id];
                document.getElementById('sell-zone').style.display = 'none';
                document.getElementById('info-zone').style.display = 'block';
                // 顯示資訊統一對齊
                document.getElementById('sold-detail').innerHTML = `
                    <div class="card-detail-item"><b>購票人姓名</b>${currentSeat.name || '-'}</div>
                    <div class="card-detail-item"><b>購票人電話</b>${currentSeat.phone || '-'}</div>
                    <div class="card-detail-item"><b>付款日期</b>${currentSeat.date || '-'}</div>
                    <div class="card-detail-item"><b>售票人員</b>${currentSeat.staff || '-'}</div>
                    <div class="card-detail-item"><b>備註</b>${currentSeat.note || '-'}</div>
                `;
            } else {
                document.getElementById('sell-zone').style.display = 'block';
                document.getElementById('info-zone').style.display = 'none';
                if (selectedIds.includes(id)) selectedIds = selectedIds.filter(i => i !== id);
                else {
                    if(selectedIds.length === 1 && seatsData[selectedIds[0]]?.status === 'sold') selectedIds = [id];
                    else if(selectedIds.length < 5) selectedIds.push(id);
                }
            }
            document.getElementById('target-id').innerText = selectedIds.length > 0 ? selectedIds.join(', ') : "請點選座位...";
            render();
        }

        document.getElementById('btn-sell-action').onclick = () => {
            const staff = document.getElementById('p-staff').value;
            if(!staff || selectedIds.length === 0) return alert("請選擇人員與座位");
            const updates = {};
            selectedIds.forEach(id => {
                updates[`seats/${id}`] = { 
                    status: 'sold', 
                    name: document.getElementById('p-name').value, 
                    phone: document.getElementById('p-phone').value, 
                    date: document.getElementById('p-date').value, 
                    staff: staff, 
                    note: document.getElementById('p-note').value 
                };
            });
            update(ref(db), updates).then(() => {
                selectedIds = [];
                document.getElementById('p-name').value = '';
                document.getElementById('p-phone').value = '';
                document.getElementById('p-note').value = '';
                document.getElementById('target-id').innerText = "請點選座位...";
            });
        };

        document.getElementById('btn-refund-action').onclick = () => {
            if(confirm("確定退票？")) {
                update(ref(db, `seats/${selectedIds[0]}`), { status: 'available', name: null, phone: null, date: null, staff: null, note: null }).then(() => {
                    selectedIds = [];
                    document.getElementById('info-zone').style.display = 'none';
                    document.getElementById('sell-zone').style.display = 'block';
                });
            }
        };

        document.getElementById('btn-export-action').onclick = () => {
            let csv = "\uFEFF座位,購票人姓名,購票人電話,付款日期,售票人員,備註\n";
            Object.keys(seatsData).forEach(id => {
                const s = seatsData[id];
                if(s.status === 'sold') csv += `${id},${s.name},${s.phone},${s.date},${s.staff},${s.note}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `MIA名冊.csv`;
            a.click();
        };
    </script>
</body>
</html>
