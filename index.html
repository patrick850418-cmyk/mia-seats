<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 MIA春季成發 即時座位系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f6; margin: 0; display: flex; height: 100vh; }
        .main-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .sidebar { width: 320px; background: white; border-left: 2px solid #ddd; padding: 20px; display: none; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.1); }
        .admin-active .sidebar { display: flex; }
        .stage-area { width: fit-content; display: flex; flex-direction: column; align-items: center; }
        .legend-area { display: flex; gap: 20px; margin-bottom: 25px; font-size: 13px; color: #444; background: #fff; padding: 10px 25px; border-radius: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-box { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #ccc; box-sizing: border-box; }
        .screen { background: #333; width: 480px; margin: 0 auto 40px; padding: 12px; color: #fff; border-radius: 0 0 60px 60px; font-weight: bold; letter-spacing: 10px; text-align: center; }
        .venue-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; }
        .block { display: flex; flex-direction: column; gap: 5px; }
        .row { display: flex; gap: 3px; height: 32px; align-items: center; }
        .left-side .row { justify-content: flex-end; }
        .middle-side .row { justify-content: center; }
        .right-side .row { justify-content: flex-start; }
        .seat { width: 32px; height: 32px; font-size: 10px; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; font-weight: bold; background: #fff; transition: all 0.1s; user-select: none; box-sizing: border-box; }
        .admin-active .seat { cursor: pointer; }
        .admin-active .seat:not(.camera-seat):active { transform: scale(0.85); background-color: #eee; }
        .available { background-color: #fff; color: #333; }
        .sold { background-color: #ff6b6b !important; color: #fff !important; border-color: #ee5253; }
        .selected { border: 3px solid #ffca28 !important; background-color: #fffde7; box-shadow: 0 0 8px rgba(255,202,40,0.6); }
        .camera-seat { background: #e0e0e0 !important; color: #999 !important; border: 1px dashed #bbb !important; cursor: default !important; }
        .camera-seat::after { content: "×"; font-size: 18px; line-height: 0; }
        .pr-seat { border: 2px solid #007bff !important; color: #007bff; background-color: #f0f7ff; }
        body:not(.admin-active) .pr-seat { cursor: default; }
        .info-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; border-left: 5px solid #007bff; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-sell { background: #28a745; color: white; }
        .btn-refund { background: #dc3545; color: white; }
        .btn-export { background: #6c757d; color: white; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: bold; margin-top: 10px; display: block; font-size: 14px; color: #34495e; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1 style="color: #2c3e50; margin-bottom: 15px;">2026 MIA春季成發 即時座位</h1>
        <div class="legend-area">
            <div class="legend-item"><div class="legend-box" style="background:#fff;"></div><span>可選</span></div>
            <div class="legend-item"><div class="legend-box" style="background:#ff6b6b; border-color:#ee5253;"></div><span>已售</span></div>
            <div class="legend-item"><div class="legend-box pr-seat"></div><span>公關席</span></div>
            <div class="legend-item"><div class="legend-box camera-seat" style="display:flex; align-items:center; justify-content:center;"></div><span>攝影席</span></div>
        </div>
        <div class="stage-area">
            <div class="screen">舞台方向</div>
            <div class="venue-container" id="grid">
                <div id="LT" class="block left-side"></div><div id="MT" class="block middle-side"></div><div id="RT" class="block right-side"></div>
                <div id="LM" class="block left-side"></div><div id="MM" class="block middle-side"></div><div id="RM" class="block right-side"></div>
                <div id="LB" class="block left-side"></div><div id="MB" class="block middle-side"></div><div id="RB" class="block right-side"></div>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <h2 style="margin-top:0; color: #2c3e50;">票務管理中心</h2>
        <div class="info-box"><div style="font-size: 12px; color: #666;">目前選中：</div><div id="target-id" style="font-size:20px; font-weight:bold; color:#007bff;">請點選座位...</div></div>
        <div id="sell-zone">
            <label>購票人姓名</label><input type="text" id="p-name">
            <label>購票人電話</label><input type="text" id="p-phone">
            <label>付款日期</label><input type="date" id="p-date">
            <label>售票人員</label>
            <select id="p-staff">
                <option value="">請選擇人員</option><option value="芷瑜">芷瑜</option><option value="Daifi">Daifi</option><option value="Ruby">Ruby</option><option value="孟萱">孟萱</option>
            </select>
            <label>備註</label><input type="text" id="p-note">
            <button class="btn btn-sell" id="btn-sell-action">確認劃位售出</button>
        </div>
        <div id="info-zone" style="display:none;">
            <div class="info-box" style="border-left-color: #dc3545;"><strong style="color:#dc3545;">已售出資訊：</strong><div id="sold-detail"></div></div>
            <button class="btn btn-refund" id="btn-refund-action">取消售出 (退票)</button>
        </div>
        <button class="btn btn-export" id="btn-export-action">📥 匯出售票名冊 (CSV)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8gIluzZA5k8fkIpC0RKvUypsSRZM9rlM",
            authDomain: "seatsystem-dbfc5.firebaseapp.com",
            databaseURL: "https://seatsystem-dbfc5-default-rtdb.firebaseio.com",
            projectId: "seatsystem-dbfc5",
            storageBucket: "seatsystem-dbfc5.firebasestorage.app",
            messagingSenderId: "924114074974",
            appId: "1:924114074974:web:3ad35d39cc6813c636a3cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';
        if(isAdmin) document.body.classList.add('admin-active');

        let seatsData = {};
        let selectedIds = [];
        const cameraSeats = ["F15", "F16", "F17", "G15", "G16", "G17"];
        const prSeats = [];
        for(let i=8; i<=20; i++) prSeats.push("A"+i);
        for(let i=9; i<=21; i++) prSeats.push("B"+i);

        const layout = [
            { id: 'T', rows: 5, L: [7,8,9,10,11], M: 13, R: [7,8,9,10,11], start: 'A' },
            { id: 'M', rows: 10, L: 9, M: 13, R: 9, start: 'F' },
            { id: 'B', rows: 10, L: 6, M: 13, R: 6, start: 'P' }
        ];

        onValue(ref(db, 'seats'), (snapshot) => {
            seatsData = snapshot.val() || {};
            render();
        });

        function render() {
            layout.forEach(sec => {
                for(let r=0; r<sec.rows; r++){
                    const rowName = String.fromCharCode(sec.start.charCodeAt(0)+r);
                    const cL = Array.isArray(sec.L)?sec.L[r]:sec.L;
                    const cM = sec.M;
                    const cR = Array.isArray(sec.R)?sec.R[r]:sec.R;
                    updateBlock(`L${sec.id}`, rowName, 1, cL);
                    updateBlock(`M${sec.id}`, rowName, cL+1, cL+cM);
                    updateBlock(`R${sec.id}`, rowName, cL+cM+1, cL+cM+cR);
                }
            });
            if(!document.getElementById('p-date').value) document.getElementById('p-date').valueAsDate = new Date();
        }

        function updateBlock(bid, rowName, start, end) {
            const block = document.getElementById(bid);
            if(rowName==='A' || rowName==='F' || rowName==='P') block.innerHTML = '';
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for(let s=start; s<=end; s++){
                const id = rowName + s;
                const div = document.createElement('div');
                if (cameraSeats.includes(id)) {
                    div.className = "seat camera-seat";
                } else {
                    const status = (seatsData[id] && seatsData[id].status) ? seatsData[id].status : 'available';
                    const isPR = prSeats.includes(id);
                    div.className = `seat ${status} ${isPR ? 'pr-seat' : ''}`;
                    if(selectedIds.includes(id)) div.classList.add('selected');
                    div.innerText = id;
                    div.onclick = () => { if(isAdmin) handleClick(id); };
                }
                rowDiv.appendChild(div);
            }
            block.appendChild(rowDiv);
        }

        function handleClick(id) {
            const currentSeat = seatsData[id] || { status: 'available' };
            if (currentSeat.status === 'sold') {
                selectedIds = [id];
                document.getElementById('sell-zone').style.display = 'none';
                document.getElementById('info-zone').style.display = 'block';
                document.getElementById('sold-detail').innerHTML = `<b>購票人：</b>${currentSeat.name || '無'}<br><b>電話：</b>${currentSeat.phone || '無'}<br><b>日期：</b>${currentSeat.date || '未紀錄'}<br><b>售票員：</b>${currentSeat.staff || '未紀錄'}<br><b>備註：</b>${currentSeat.note || '無'}`;
            } else {
                document.getElementById('sell-zone').style.display = 'block';
                document.getElementById('info-zone').style.display = 'none';
                if (selectedIds.includes(id)) selectedIds = selectedIds.filter(i => i !== id);
                else {
                    if(selectedIds.length === 1 && seatsData[selectedIds[0]]?.status === 'sold') selectedIds = [id];
                    else if(selectedIds.length < 5) selectedIds.push(id);
                    else alert("一次最多劃位 5 張票！");
                }
            }
            document.getElementById('target-id').innerText = selectedIds.length > 0 ? selectedIds.join(', ') : "請點選座位...";
            render();
        }

        document.getElementById('btn-sell-action').onclick = () => {
            if(selectedIds.length === 0) return;
            const staff = document.getElementById('p-staff').value;
            if(!staff) return alert("請選擇售票人員！");
            const updates = {};
            selectedIds.forEach(id => {
                updates[`seats/${id}`] = { status: 'sold', name: document.getElementById('p-name').value, phone: document.getElementById('p-phone').value, date: document.getElementById('p-date').value, staff: staff, note: document.getElementById('p-note').value };
            });
            update(ref(db), updates).then(() => {
                selectedIds = [];
                document.getElementById('p-name').value = ''; document.getElementById('p-phone').value = ''; document.getElementById('p-note').value = ''; document.getElementById('p-staff').value = '';
                document.getElementById('target-id').innerText = "請點選座位...";
            });
        };

        document.getElementById('btn-refund-action').onclick = () => {
            const id = selectedIds[0];
            if(confirm(`確定取消座位 ${id} 的售出狀態嗎？`)) {
                update(ref(db, `seats/${id}`), { status: 'available', name: null, phone: null, date: null, staff: null, note: null }).then(() => {
                    selectedIds = [];
                    document.getElementById('target-id').innerText = "請點選座位...";
                    document.getElementById('info-zone').style.display = 'none';
                    document.getElementById('sell-zone').style.display = 'block';
                });
            }
        };

        // 匯出功能
        document.getElementById('btn-export-action').onclick = () => {
            let csvContent = "\uFEFF座位,購票人,電話,售票日期,售票員,備註\n";
            Object.keys(seatsData).forEach(id => {
                const s = seatsData[id];
                if(s.status === 'sold') {
                    csvContent += `${id},${s.name || ''},${s.phone || ''},${s.date || ''},${s.staff || ''},${s.note || ''}\n`;
                }
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `MIA春季成發_售票名冊_${new Date().toLocaleDateString()}.csv`;
            link.click();
        };
    </script>
</body>
</html>
